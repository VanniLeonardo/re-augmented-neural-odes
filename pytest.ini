[pytest]
# Only collect the real test package. The coursework left executable smoke
# scripts named test_*.py under scripts/ (they downloaded MNIST + ran a forward
# pass at collection time); they are now scripts/smoke_*.py and scripts/ is not
# recursed into. The Rubanova/Latent-ODE tests are marked `extra` and excluded
# from the gated suite via `pytest -m "not extra"` (see the Makefile).
testpaths = tests
norecursedirs = scripts extra data wandb plots results figures notebooks references .git
markers =
    extra: out-of-scope (Rubanova / Latent-ODE) tests, excluded from the gated replication suite
